
server.port=8080
spring.application.name=api-gateway

# Customer Service
spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/customers/**

# Account Service
spring.cloud.gateway.server.webflux.routes[1].id=account-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/accounts/**

# Transaction Service
spring.cloud.gateway.server.webflux.routes[2].id=transaction-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/transactions/**

# Screening Service
spring.cloud.gateway.server.webflux.routes[3].id=screening-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/screening/**

# Payment Orchestration Service
spring.cloud.gateway.server.webflux.routes[4].id=payment-orchestration-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**

# Centralised Earmarking Service
spring.cloud.gateway.server.webflux.routes[5].id=earmarking-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/review-cases/**

# Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
