spring.application.name=account

server.port= 8082


spring.datasource.url=jdbc:mysql://localhost:3306/account_db
spring.datasource.username=root
spring.datasource.password=Sai@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info


server.ssl.enabled=true

# Account Service identity
server.ssl.key-store=classpath:certs/account-service.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=Sai@123
server.ssl.key-alias=account-service

# Trust CES client certificate
server.ssl.trust-store=classpath:certs/account-truststore.p12
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=Sai@123

# Enforce mutual TLS
server.ssl.client-auth=none

