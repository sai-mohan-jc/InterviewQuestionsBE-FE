spring.application.name=payment-orchestration-service

server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/payment_orchestration_db
spring.datasource.username=root
spring.datasource.password=Sai@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false


# Kafka broker connection
spring.kafka.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096

# Producer key and value serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
