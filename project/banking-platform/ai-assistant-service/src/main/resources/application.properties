spring.application.name=ai-assistant-service


server.port=8088



spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=qwen/qwen3.8-27b
spring.ai.openai.chat.options.temperature=0.2


# AI request timeout
spring.ai.openai.timeout=30s

# Disable automatic retries for now
spring.ai.openai.max-retries=0

# JWT Security
app.security.jwt.issuer=banking-auth-service

# Customer Service Configuration
customer.service.base-url=http://localhost:8081

# Account Service Configuration
account.service.base-url=https://localhost:8082


# PostgreSQL - RAG Vector Database
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_rag_db
spring.datasource.username=postgres
spring.datasource.password=Sai@123

# Gemini Embedding Model
spring.ai.google.genai.embedding.api-key=${GCP_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# PGVector Store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# Select Gemini as the embedding provider
spring.ai.model.embedding.text=google-genai

# Disable OpenAI embedding auto-configuration
spring.ai.model.embedding=none


# MCP Client Configuration
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=banking-ai-assistant
spring.ai.mcp.client.type=SYNC

# Banking MCP Server connection
spring.ai.mcp.client.streamable-http.connections.banking-mcp-server.url=http://localhost:8089

